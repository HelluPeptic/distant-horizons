# Performance Optimization Configuration for Distant Horizons 1.20.1 Fabric
# This configuration is optimized for maximum FPS performance

# Core Performance Settings
distant_horizons_fps_optimization=true
performance_mode=aggressive
target_fps=120

# Memory Management
memory_pool_size_mb=2048
garbage_collection_frequency=30
chunk_cache_size=4096

# Rendering Optimizations
lod_bias=-1.5
texture_filtering=linear
mipmapping=enabled
backface_culling=enabled
depth_testing=optimized
seamless_overdraw=true

# Distance and Quality Settings (optimized for performance)
render_distance_lod=32
quality_preset=performance
detail_level=medium
vertex_optimization=enabled

# Threading and CPU Optimization
worker_threads=auto
chunk_generation_threads=4
async_chunk_loading=enabled
cpu_optimization_level=high

# GPU Optimizations
vbo_usage=enabled
gpu_memory_allocation=optimal
shader_optimization=enabled
texture_streaming=enabled

# Fabric-specific Optimizations
fabric_rendering_api=optimized
sodium_compatibility=enhanced
iris_compatibility=enabled

# Debug and Monitoring (disable for max performance)
debug_rendering=false
performance_monitoring=false
fps_display=true

# Experimental Performance Features
aggressive_culling=true
chunk_cache_compression=enabled
texture_cache_optimization=true
render_state_caching=enabled
