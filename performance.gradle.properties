# Performance-Optimized Build Configuration for Distant Horizons 1.20.1 Fabric
# Use this configuration by running: gradlew build -Pperformance=true

# JVM arguments for maximum performance during build
org.gradle.jvmargs=-Xmx4G -XX:+UseG1GC -XX:+UnlockExperimentalVMOptions -XX:+UseJVMCICompiler

# Enable parallel builds and daemon
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.caching=true

# Fabric-specific performance optimizations
fabric.loom.multiProjectOptimisation=true
fabric.loom.shareCaches=true

# Minecraft version targeting (change this to switch versions)
mc_target_version=1.20.1

# Performance-oriented compiler optimizations
performance_build=true
optimize_for_fps=true
aggressive_optimizations=true

# Disable unnecessary features for performance builds
disable_debug=true
disable_logging=false
enable_texture_optimizations=true
enable_gpu_optimizations=true

# Memory and threading optimizations
max_worker_threads=8
memory_optimization_level=high
gc_optimization=true
